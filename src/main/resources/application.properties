spring.application.name=get_geo_pg

spring.datasource.url=jdbc:postgresql://localhost:5432/mdb1?stringtype=unspecified
spring.datasource.jdbc-url=jdbc:postgresql://localhost:5432/mdb1?stringtype=unspecified
spring.datasource.username=postgres
spring.datasource.password=4732
spring.datasource.driver-class-name=org.postgresql.Driver

# graphs 数据库配置
graphs.datasource.url=jdbc:postgresql://localhost:5432/graphs?stringtype=unspecified
graphs.datasource.jdbc-url=jdbc:postgresql://localhost:5432/graphs?stringtype=unspecified
graphs.datasource.username=postgres
graphs.datasource.password=4732
graphs.datasource.driver-class-name=org.postgresql.Driver

# 服务端口
server.port=8085
server.servlet.context-path=/get_geo_pg

# 允许上传大型 SHP 矢量文件夹（设为 500MB 支持大面积路网）
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# RSA 密钥文件目录（存放 private_key.pem 和 public_key.pem）
pem.dir=${PEM_DIR:D:/RSA_KEYS}

# 服务器临时存储 SHP 解压/解包文件的目录（留空则使用系统默认临时目录 java.io.tmpdir）
app.temp-dir=${APP_TEMP_DIR:}

# PostGIS 矢量转换工具 shp2pgsql 的路径（留空则自动检索 PATH 及常见 Linux/Windows PostgreSQL 安装路径）
app.shp2pgsql-path=${SHP2PGSQL_PATH:}

# 上线后，在/etc/systemd/system下的tomcat.service或环境变量中添加：
# Environment=PEM_DIR=/opt/tomcat9/RSA_KEYS
# Environment=APP_TEMP_DIR=/opt/temp/shp
# Environment=SHP2PGSQL_PATH=/usr/bin/shp2pgsql
# Environment=PGRB_STORAGE_DIR=/opt/data/pgrb

# ==============================================================================
# PGRB 二进制路网文件存储目录配置（明确写出服务器端位置）
# ==============================================================================
# 服务器端（Linux 生产环境）明确存储位置：
pgrb.storage.dir.server=/opt/data/pgrb

# 本地开发调试（Windows 环境）存储位置：
pgrb.storage.dir.local=E:/JavaPro/QSKJ/get_geo_pg/data/pgrb

# 实际生效路径配置项（默认直接指向服务器端绝对路径，支持本地开发自愈降级与环境变量注入）：
pgrb.storage.dir=/opt/data/pgrb